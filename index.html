<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6d1818" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<title>학생 찾기</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
html, body { margin: 0; padding: 0; background: #faf7f4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
.pt-safe { padding-top: calc(env(safe-area-inset-top) + 12px); }
.pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 12px); }
input, select, button { font-size: 16px !important; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 20px; height: 20px; border: 2px solid #e7e5e4; border-top-color: #6d1818; border-radius: 50%; animation: spin 0.6s linear infinite; }
.spinner-sm { width: 14px; height: 14px; border: 2px solid #e7e5e4; border-top-color: #6d1818; border-radius: 50%; animation: spin 0.6s linear infinite; }
.burgundy-gradient { background: linear-gradient(135deg, #6d1818 0%, #991b1b 100%); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzgSO9kkIeM71XVBmdrPJe5AeJaUAjtGUAIwcxljXPyR65w7oxprKjQs0zM4KTqOcuz/exec';
const PW_KEY = 'student_finder_pw';
const photoUrlCache = {}; // { studentKey: url } - 사진 URL 캐시
const photoQueue = []; // 요청 대기열
let photoRequesting = 0; // 현재 요청 중인 개수
const MAX_CONCURRENT_PHOTOS = 5; // 동시 요청 최대 개수

// 사진 요청 큐 처리
async function requestPhotoQueued(studentKey, password, studentId) {
  // 캐시에 있으면 즉시 반환
  if (photoUrlCache[studentKey] !== undefined) {
    return photoUrlCache[studentKey];
  }
  
  return new Promise((resolve) => {
    const process = async () => {
      photoRequesting++;
      try {
        const result = await callApi('getPhoto', password, { studentKey, studentId: studentId || '' });
        const url = result.success ? result.photoUrl : null;
        photoUrlCache[studentKey] = url;
        resolve(url);
      } catch {
        photoUrlCache[studentKey] = null;
        resolve(null);
      } finally {
        photoRequesting--;
        // 대기 중인 다음 요청 실행
        if (photoQueue.length > 0 && photoRequesting < MAX_CONCURRENT_PHOTOS) {
          const next = photoQueue.shift();
          next();
        }
      }
    };
    
    if (photoRequesting < MAX_CONCURRENT_PHOTOS) {
      process();
    } else {
      photoQueue.push(process);
    }
  });
}

const CLASS_COUNT = { '1': 5, '2': 5, '3': 6 };
const GRADE_COLORS = {
  '1': 'linear-gradient(135deg, #fbbf24 0%, #d97706 100%)',
  '2': 'linear-gradient(135deg, #fb923c 0%, #c2410c 100%)',
  '3': 'linear-gradient(135deg, #f87171 0%, #b91c1c 100%)',
};

const AVATAR_GRADIENTS = [
  'linear-gradient(135deg, #fbbf24 0%, #d97706 100%)',
  'linear-gradient(135deg, #fb7185 0%, #be123c 100%)',
  'linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%)',
  'linear-gradient(135deg, #34d399 0%, #047857 100%)',
  'linear-gradient(135deg, #38bdf8 0%, #0369a1 100%)',
  'linear-gradient(135deg, #f472b6 0%, #be185d 100%)',
  'linear-gradient(135deg, #fb923c 0%, #c2410c 100%)',
  'linear-gradient(135deg, #818cf8 0%, #4338ca 100%)',
];
function getAvatarGradient(key) {
  let hash = 0;
  for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) | 0;
  return AVATAR_GRADIENTS[Math.abs(hash) % AVATAR_GRADIENTS.length];
}

async function callApi(action, password, params = {}) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('password', password);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { method: 'GET' });
  return await res.json();
}

const UNIV_COLORS = [
  '#6d1818','#1d4ed8','#065f46','#7e22ce','#92400e',
  '#1e3a8a','#991b1b','#0369a1','#166534','#be185d',
];
function getUnivColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
  return UNIV_COLORS[Math.abs(hash) % UNIV_COLORS.length];
}

function LoginScreen({ onLogin }) {
  const [pw, setPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  
  const handleLogin = async () => {
    if (!pw.trim()) return;
    setLoading(true);
    setError('');
    try {
      const result = await callApi('login', pw);
      if (result.success) {
  onLogin(pw);
} else setError(result.error || '로그인 실패');
} catch {
      setError('서버 연결 실패. 인터넷을 확인하세요.');
    } finally { setLoading(false); }
  };
  
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6" style={{background: '#faf7f4'}}>
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div className="w-16 h-16 burgundy-gradient rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l9-5-9-5-9 5 9 5z M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /></svg>
          </div>
          <h1 className="text-2xl font-medium" style={{color: '#1c1917'}}>학생 찾기</h1>
          <p className="text-sm mt-2" style={{color: '#78716c'}}>비밀번호를 입력하세요</p>
        </div>
        <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleLogin()} placeholder="비밀번호" className="w-full px-4 py-3.5 text-base bg-white border rounded-2xl focus:outline-none" style={{borderColor: '#e7e5e4'}} autoFocus />
        {error && <p className="text-sm text-red-600 mt-2">{error}</p>}
        <button onClick={handleLogin} disabled={loading || !pw.trim()} className="w-full mt-4 py-3.5 text-white rounded-2xl font-medium disabled:opacity-40 active:opacity-90 burgundy-gradient">
          {loading ? '확인 중...' : '로그인'}
        </button>
      </div>
    </div>
  );
}

function StudentPhoto({ student, password, className, fallbackClass, showInitial }) {
  const [photoUrl, setPhotoUrl] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  
    useEffect(() => {
    if (student.photoUrl) { setPhotoUrl(student.photoUrl); setLoading(false); return; }
    let cancelled = false;
    (async () => {
      try {
        const url = await requestPhotoQueued(student.studentKey, password, student.studentId);
        if (!cancelled && url) {
          setPhotoUrl(url);
        }
      } catch {}
      finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [student.studentKey, password]);
  
  if (loading && showInitial) {
    return <div className={fallbackClass} style={{background: getAvatarGradient(student.studentKey)}}><span className="text-white font-medium" style={{fontSize: '1.5em'}}>{student.name.charAt(0)}</span></div>;
  }
  if (loading) return <div className={fallbackClass}><div className="spinner-sm" /></div>;
  if (error || !photoUrl) {
    if (showInitial) {
      return <div className={fallbackClass} style={{background: getAvatarGradient(student.studentKey)}}><span className="text-white font-medium" style={{fontSize: '1.5em'}}>{student.name.charAt(0)}</span></div>;
    }
    return <div className={fallbackClass}><svg className="w-1/3 h-1/3 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></div>;
  }
  return <img src={photoUrl} alt={student.name} className={className} style={{objectPosition: 'center top'}} onError={() => setError(true)} referrerPolicy="no-referrer" />;
}

// 학적 상태 배지/메뉴 (이름 옆에 작게)
function StatusBadge({ status, onChange, loading }) {
  const [open, setOpen] = useState(false);
  
  const styles = {
    '재학': { bg: open ? '#6d1818' : '#dcfce7', color: open ? 'white' : '#15803d', border: open ? '#6d1818' : '#86efac', dot: '#15803d' },
    '전학': { bg: open ? '#6d1818' : '#fef3c7', color: open ? 'white' : '#b45309', border: open ? '#6d1818' : '#fde68a', dot: '#b45309' },
    '자퇴': { bg: open ? '#6d1818' : '#fee2e2', color: open ? 'white' : '#dc2626', border: open ? '#6d1818' : '#fecaca', dot: '#dc2626' },
  };
  const s = styles[status] || styles['재학'];
  
  const handleSelect = async (newStatus) => {
    setOpen(false);
    if (newStatus !== status) {
      await onChange(newStatus);
    }
  };
  
  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="px-2.5 py-1 rounded-full text-[11px] font-medium flex items-center gap-1.5 transition-colors" style={{background: s.bg, color: s.color, border: `0.5px solid ${s.border}`}}>
        {loading ? (
          <div className="w-3 h-3 rounded-full border-2 border-current border-t-transparent animate-spin" />
        ) : (
          <span className="w-1.5 h-1.5 rounded-full" style={{background: open ? 'white' : s.dot}} />
        )}
        {status}
        <svg className={`w-3 h-3 transition-transform ${open ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7" /></svg>
      </button>
      {open && (
        <div className="absolute right-0 top-full mt-1.5 bg-white rounded-xl shadow-lg z-10 overflow-hidden" style={{border: '0.5px solid #e7e5e4', minWidth: '110px'}}>
          {['재학', '전학', '자퇴'].map((opt) => (
            <button key={opt} onClick={() => handleSelect(opt)} className="w-full px-3 py-2 text-left text-sm flex items-center gap-2 hover:bg-stone-50" style={{color: status === opt ? '#6d1818' : '#1c1917', fontWeight: status === opt ? 500 : 400, background: status === opt ? '#fef2f2' : 'white'}}>
              <span className="w-1.5 h-1.5 rounded-full" style={{background: styles[opt].dot}} />
              {opt}
              {status === opt && <svg className="w-3.5 h-3.5 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function StudentCard({ student, password, onStatusChanged }) {
  const [status, setStatus] = useState(student.status || '재학');
  const [updating, setUpdating] = useState(false);
  const [grades, setGrades] = useState(null);
  const [gradesLoading, setGradesLoading] = useState(true);
  const [showDetail, setShowDetail] = useState(false);
  const [note, setNote] = useState(student.note || '');
  const [editingNote, setEditingNote] = useState(false);
  const [noteSaving, setNoteSaving] = useState(false);
  
  const handleSaveNote = async (newNote) => {
    setNoteSaving(true);
    try {
      const result = await callApi('updateNote', password, { studentKey: student.studentKey, note: newNote });
      if (result.success) {
        setNote(newNote);
        setEditingNote(false);
      } else {
        alert('저장 실패: ' + (result.error || ''));
      }
    } catch { alert('서버 연결 실패'); }
    finally { setNoteSaving(false); }
  };
  
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setGradesLoading(true);
      try {
        const result = await callApi('getGrades', password, { studentKey: student.studentKey, studentId: student.studentId });
        if (cancelled) return;
        if (result.success && result.grades) setGrades(result.grades);
      } catch {} 
      finally { if (!cancelled) setGradesLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [student.studentKey, password]);
  
  const formatPhone = (phone) => phone ? phone.replace(/-/g, '') : '';
  const getMapUrl = (address) => address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}` : '#';
  
  const handleStatusChange = async (newStatus) => {
    setUpdating(true);
    try {
      const result = await callApi('updateStatus', password, { studentKey: student.studentKey, status: newStatus });
      if (result.success) {
        setStatus(newStatus);
        if (onStatusChanged) onStatusChanged(newStatus);
      } else {
        alert('학적 변경 실패: ' + (result.error || '알 수 없는 오류'));
      }
    } catch {
      alert('서버 연결 실패');
    } finally { setUpdating(false); }
  };
  
  return (
    <div className="bg-white rounded-2xl overflow-hidden" style={{border: '0.5px solid #e7e5e4'}}>
      <div className="aspect-[3/4] flex items-center justify-center relative" style={{background: '#f5f5f4'}}>
        <StudentPhoto student={student} password={password} className="w-full h-full object-cover" fallbackClass="w-full h-full flex items-center justify-center" showInitial={true} />
      </div>
      <div className="p-4">
        <div className="flex items-center gap-2 mb-1">
          <h2 className="text-xl font-medium" style={{color: '#1c1917'}}>{student.name}</h2>
          <span className="text-sm" style={{color: '#78716c'}}>{student.grade}학년 {student.classNum}반 {student.number}번</span>
          <div className="ml-auto">
            <StatusBadge status={status} onChange={handleStatusChange} loading={updating} />
          </div>
        </div>
                {grades && grades['성적_중학교'] && grades['성적_중학교']['출신중'] && (
          <p className="text-xs mb-3 flex items-center gap-1" style={{color: '#78716c'}}>
            <span>🏫</span>{grades['성적_중학교']['출신중']}
          </p>
        )}
        {!grades && <div className="mb-3" />}
        <div className="space-y-2">
          <a href={`tel:${formatPhone(student.studentPhone)}`} className="flex items-center justify-between p-3 rounded-xl active:opacity-70" style={{background: '#fafaf9'}}>
            <div className="flex items-center gap-3 min-w-0">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background: '#dbeafe'}}>
                <svg className="w-4 h-4" style={{color: '#1d4ed8'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
              </div>
              <div className="min-w-0">
                <p className="text-xs" style={{color: '#a8a29e'}}>학생</p>
                <p className="text-base font-medium" style={{color: '#1c1917'}}>{student.studentPhone}</p>
              </div>
            </div>
            <svg className="w-5 h-5 flex-shrink-0" style={{color: '#d6d3d1'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
          </a>
          <a href={`tel:${formatPhone(student.parentPhone)}`} className="flex items-center justify-between p-3 rounded-xl active:opacity-70" style={{background: '#fafaf9'}}>
            <div className="flex items-center gap-3 min-w-0">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background: '#fef3c7'}}>
                <svg className="w-4 h-4" style={{color: '#b45309'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
              </div>
              <div className="min-w-0">
                <p className="text-xs" style={{color: '#a8a29e'}}>학부모</p>
                <p className="text-base font-medium" style={{color: '#1c1917'}}>{student.parentPhone}</p>
              </div>
            </div>
            <svg className="w-5 h-5 flex-shrink-0" style={{color: '#d6d3d1'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
          </a>
          <NoteBlock note={note} editing={editingNote} setEditing={setEditingNote} onSave={handleSaveNote} saving={noteSaving} />
          {student.address && (
            <a href={getMapUrl(student.address)} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3 rounded-xl active:opacity-70" style={{background: '#fafaf9'}}>
              <div className="flex items-start gap-3 min-w-0">
                <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background: '#dcfce7'}}>
                  <svg className="w-4 h-4" style={{color: '#15803d'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-xs" style={{color: '#a8a29e'}}>주소 (탭하면 길찾기)</p>
                  <p className="text-sm break-keep leading-snug" style={{color: '#1c1917'}}>{student.address}</p>
                </div>
              </div>
              <svg className="w-4 h-4 flex-shrink-0 ml-2 mt-1" style={{color: '#d6d3d1'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
            </a>
          )}
        </div>
        
        <GradesSection student={student} grades={grades} loading={gradesLoading} showDetail={showDetail} setShowDetail={setShowDetail} />
      </div>
    </div>
  );
}

function NoteBlock({ note, editing, setEditing, onSave, saving }) {
  const [text, setText] = useState(note);
  
  useEffect(() => { setText(note); }, [note]);
  
  if (editing) {
    return (
      <div className="p-3 rounded-xl" style={{background: '#fffbeb', border: '0.5px solid #fde68a'}}>
        <div className="flex items-center gap-2 mb-2">
          <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background: '#fef3c7'}}>
            <svg className="w-4 h-4" style={{color: '#b45309'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
          </div>
          <p className="text-xs font-medium" style={{color: '#92400e'}}>특이사항 편집</p>
        </div>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder="예: 반장, 천식 있음, 알레르기 주의 등"
          rows={3}
          className="w-full p-2 rounded-lg text-sm focus:outline-none"
          style={{border: '0.5px solid #fcd34d', background: 'white'}}
        />
        <div className="flex gap-2 mt-2">
          <button onClick={() => { setText(note); setEditing(false); }} className="flex-1 py-2 rounded-lg text-xs font-medium" style={{background: 'white', color: '#78716c', border: '0.5px solid #e7e5e4'}}>
            취소
          </button>
          <button onClick={() => onSave(text)} disabled={saving} className="flex-1 py-2 rounded-lg text-xs font-medium text-white disabled:opacity-40" style={{background: '#b45309'}}>

function GradesSection({ student, grades, loading }) {
  if (loading) {
    return <div className="mt-3 flex justify-center py-4"><div className="spinner-sm" /></div>;
  }
  if (!grades || Object.keys(grades).length === 0) return null;

  const parse = (name) => {
    const m = name.match(/^성적_(\d{4})_(\d)학년_(1학기|2학기|학년말)$/);
    if (!m) return null;
    const termOrder = { '1학기': 1, '2학기': 2, '학년말': 3 };
    return { year: +m[1], grade: +m[2], term: m[3], order: +m[1] * 10 + termOrder[m[3]] };
  };
  const middle = grades['성적_중학교'];
  const records = Object.keys(grades)
    .map(n => ({ name: n, meta: parse(n), data: grades[n] }))
    .filter(r => r.meta)
    .sort((a, b) => a.meta.order - b.meta.order);
  const schemes = ['purple', 'green', 'orange', 'teal'];

  return (
    <>
      {middle && middle['중학교성적'] && (
        <div className="mt-3 rounded-2xl p-4" style={{background: 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)', border: '0.5px solid #fcd34d'}}>
          <div className="flex items-center gap-1.5 mb-2">
            <svg className="w-4 h-4" style={{color: '#b45309'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l9-5-9-5-9 5 9 5z" /></svg>
            <p className="text-xs font-medium" style={{color: '#92400e'}}>중학교 성적</p>
          </div>
          <p className="text-3xl font-medium text-center tracking-wide" style={{color: '#78350f'}}>{middle['중학교성적']}</p>
        </div>
      )}
      {records.map((r, i) => {
        const isLast = i === records.length - 1;
        return (
          <GradeBlock
            key={r.name}
            title={`${r.meta.grade}학년 ${r.meta.term} 내신 · ${r.meta.year}`}
            colorScheme={isLast ? 'blue' : schemes[i % schemes.length]}
            grades={r.data}
            hasFiveGrade={r.data['전교과_5등급'] !== undefined}
            isNew={isLast}
          />
        );
      })}
    </>
  );
}

function GradeBlock({ title, colorScheme, grades, hasFiveGrade, isNew }) {
  const [showDetail, setShowDetail] = useState(false);
  const colors = {
    purple: { bg: 'linear-gradient(135deg, #f3e8ff 0%, #ede9fe 100%)', border: '#c4b5fd', text: '#5b21b6', sub: '#7c3aed', value: '#5b21b6' },
    green: { bg: 'linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%)', border: '#86efac', text: '#166534', sub: '#15803d', value: '#166534' },
    orange: { bg: 'linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%)', border: '#fdba74', text: '#9a3412', sub: '#c2410c', value: '#9a3412' },
    teal: { bg: 'linear-gradient(135deg, #ccfbf1 0%, #99f6e4 100%)', border: '#5eead4', text: '#115e59', sub: '#0f766e', value: '#115e59' },
    blue: { bg: 'linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%)', border: '#93c5fd', text: '#1e40af', sub: '#2563eb', value: '#1e40af' },
  };
  const c = colors[colorScheme] || colors.purple;

  const getGrade = (s) => hasFiveGrade
    ? { five: grades[`${s}_5등급`], nine: grades[`${s}_9등급`] }
    : { nine: grades[`${s}_9등급`] };
  const formatVal = (v) => (v === null || v === undefined || v === '' || v === '-') ? '-' : v;

  const mainSubjects = ['전교과', '국', '수', '영'];
  const detailSubjects = ['사', '과', '수과', '국수영', '국수영사', '국수영과', '국수영사과'];
  const hasData = (list) => list.some(s => { const g = getGrade(s); return (g.nine && g.nine !== '-') || (g.five && g.five !== '-'); });
  if (!hasData(mainSubjects)) return null;
  const hasDetail = hasData(detailSubjects);

  return (
    <div className="mt-3 rounded-2xl p-4" style={{background: c.bg, border: `0.5px solid ${c.border}`}}>
      <div className="flex items-center gap-1.5 mb-3">
        <svg className="w-4 h-4" style={{color: c.sub}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
        <p className="text-xs font-medium" style={{color: c.text}}>{title}</p>
        {isNew && <span className="text-[9px] font-medium px-1.5 py-0.5 rounded ml-auto" style={{background: c.sub, color: 'white'}}>NEW</span>}
      </div>
      <div className="grid grid-cols-4 gap-1.5">
        {mainSubjects.map(s => {
          const g = getGrade(s);
          return (
            <div key={s} className="bg-white rounded-lg py-2 px-1 text-center">
              <p className="text-[10px]" style={{color: '#6b7280'}}>{s}</p>
              {hasFiveGrade ? (
                <>
                  <p className="text-sm font-medium mt-0.5" style={{color: c.value}}>{formatVal(g.five)}</p>
                  <p className="text-[10px]" style={{color: '#9ca3af'}}>{formatVal(g.nine)}</p>
                </>
              ) : (
                <p className="text-sm font-medium mt-0.5" style={{color: c.value}}>{formatVal(g.nine)}</p>
              )}
            </div>
          );
        })}
      </div>
      {hasFiveGrade && <p className="text-[10px] text-center mt-2" style={{color: c.sub}}>큰 숫자: 5등급 · 작은 숫자: 9등급</p>}
      {hasDetail && (
        <button onClick={() => setShowDetail(!showDetail)} className="w-full mt-3 py-2 bg-white rounded-lg text-xs font-medium flex items-center justify-center gap-1" style={{color: c.sub, border: `0.5px solid ${c.border}`}}>
          {showDetail ? '계열별 접기' : '계열별 자세히 보기'}
          <svg className={`w-3 h-3 transition-transform ${showDetail ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7" /></svg>
        </button>
      )}
      {showDetail && (
        <div className="grid grid-cols-2 gap-1.5 mt-2">
          {detailSubjects.map(s => {
            const g = getGrade(s);
            if ((!g.nine || g.nine === '-') && (!g.five || g.five === '-')) return null;
            return (
              <div key={s} className="bg-white rounded-lg py-2 px-2 text-center">
                <p className="text-[10px]" style={{color: '#6b7280'}}>{s}</p>
                <p className="text-sm font-medium mt-0.5" style={{color: c.value}}>{hasFiveGrade ? `${formatVal(g.five)} · ${formatVal(g.nine)}` : formatVal(g.nine)}</p>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function AdmissionListScreen({ password, onBack, onSelectUniv, year, setYear }) {
  const [years, setYears] = useState([]);

  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const r = await callApi('getAdmissionYears', password);
        if (r.success && r.years && r.years.length) {
          setYears(r.years);
          if (!year || !r.years.includes(year)) setYear(r.years[0]);

      } catch { setLoading(false); }

  }, [password]);

  useEffect(() => {
    if (!year) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      try {
        const result = await callApi('getAdmissions', password, { year });
        if (!cancelled && result.success) setAdmissions(result.admissions || []);
      } catch {}
      finally { if (!cancelled) setLoading(false); }

    return () => { cancelled = true; };

  const total = admissions.reduce((s, a) => s + a.count, 0);

  return (

        if (admResult.success) setAdmissions(admResult.admissions || []);

    })();

function ClassDetailScreen({ password, grade, classNum, onBack, onSelectStudent, sortMode, setSortMode }) {
  const [students, setStudents] = useState([]);
  const [homeroom, setHomeroom] = useState('');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [gradesMap, setGradesMap] = useState({}); // { studentKey: gradesData }
  const [gradesLoading, setGradesLoading] = useState(false);
  
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true);
      setError('');
      try {
        const result = await callApi('searchClass', password, { grade, classNum });
        if (cancelled) return;
        if (result.success) {
          setStudents(result.results || []);
          setHomeroom(result.homeroom || '');
        }
        else setError(result.error || '조회 실패');
      } catch { if (!cancelled) setError('서버 연결 실패'); }
      finally { if (!cancelled) setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [grade, classNum, password]);
  
    const [labels, setLabels] = useState({ current: '', previous: '' });

  // 성적순 전환 시 학년 전체 성적 한 번에 로드 (학번 기준)
  useEffect(() => {
    if (sortMode !== 'grade' || Object.keys(gradesMap).length > 0) return;
    let cancelled = false;
    (async () => {
      setGradesLoading(true);
      try {
        const r = await callApi('getGradeSemesterAll', password, { grade });
        if (!cancelled && r.success && r.grades) {
          const cur = r.grades.current || {};
          const map = {};
          Object.keys(cur).forEach(id => { map[id] = { cur: cur[id] }; });
          setGradesMap(map);
          setLabels({ current: r.grades.currentLabel || '', previous: r.grades.previousLabel || '' });
        }
      } catch {}
      if (!cancelled) setGradesLoading(false);
    })();
    return () => { cancelled = true; };
  }, [sortMode, password, grade]);

  const enrolledCount = students.filter(s => !s.status || s.status === '재학').length;
  const has5 = Object.values(gradesMap).some(g => g.cur && g.cur['전교과_5등급'] !== undefined);
  const gradeLabel = has5 ? '5등급' : '9등급';

  const getGradeInfo = (student) => {
    const gd = gradesMap[student.studentId];
    if (!gd || !gd.cur) return null;
    const s = gd.cur;
    const suffix = s['전교과_5등급'] !== undefined ? '_5등급' : '_9등급';
    return { total: s[`전교과${suffix}`], total9: s['전교과_9등급'], kor: s[`국${suffix}`], math: s[`수${suffix}`], eng: s[`영${suffix}`] };
  };

  const sortedByGrade = React.useMemo(() => {
    if (sortMode !== 'grade') return students;
    return [...students]
      .filter(s => !s.status || s.status === '재학')
      .map(s => ({ student: s, gradeInfo: getGradeInfo(s) }))
      .filter(x => x.gradeInfo && x.gradeInfo.total !== undefined && x.gradeInfo.total !== null)
      .sort((a, b) => Number(a.gradeInfo.total) - Number(b.gradeInfo.total));
  }, [sortMode, students, gradesMap]);
        
  return (
    <div className="min-h-screen" style={{background: '#faf7f4'}}>
      <div className="pt-safe burgundy-gradient">
        <div className="px-5 pb-5">
          <div className="flex items-center gap-2 mb-3">
            <button onClick={onBack} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background: 'rgba(255,255,255,0.15)'}}>
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <p className="text-sm" style={{color: 'rgba(255,255,255,0.75)'}}>반별 보기</p>
          </div>
          <div className="flex items-baseline justify-between mb-3">
            <div className="flex items-baseline gap-2">
              <h1 className="text-2xl font-medium text-white">{grade}학년 {classNum}반</h1>
              {homeroom && <span className="text-sm" style={{color: 'rgba(255,255,255,0.85)'}}>· {homeroom}</span>}
            </div>
            {!loading && (
              <p className="text-sm" style={{color: 'rgba(255,255,255,0.75)'}}>
                재학 {enrolledCount}명{students.length !== enrolledCount && ` / 전체 ${students.length}명`}
              </p>
            )}
          </div>
          
          <div className="flex gap-1 p-1 rounded-xl" style={{background: 'rgba(255,255,255,0.12)'}}>
            <button onClick={() => setSortMode('number')} className="flex-1 py-2 text-xs font-medium rounded-lg flex items-center justify-center gap-1" style={sortMode === 'number' ? {background: 'white', color: '#6d1818'} : {background: 'transparent', color: 'rgba(255,255,255,0.85)'}}>
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 20V4M17 4v16M7 4l-3 3M17 20l3-3" /></svg>
              번호순
            </button>
            <button onClick={() => setSortMode('grade')} className="flex-1 py-2 text-xs font-medium rounded-lg flex items-center justify-center gap-1" style={sortMode === 'grade' ? {background: 'white', color: '#6d1818'} : {background: 'transparent', color: 'rgba(255,255,255,0.85)'}}>
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
              성적순
            </button>
          </div>
        </div>
      </div>
      
      <div className="px-4 py-4 pb-safe">
        {loading && (
          <div className="flex flex-col items-center justify-center py-16">
            <div className="spinner mb-3" />
            <p className="text-xs" style={{color: '#a8a29e'}}>학생 정보 불러오는 중...</p>
          </div>
        )}
        {!loading && error && <p className="text-center text-red-600 py-4">{error}</p>}
        {!loading && !error && students.length === 0 && (
          <p className="text-center py-12 text-sm" style={{color: '#a8a29e'}}>해당 반에 학생이 없습니다</p>
        )}
        
        {!loading && !error && students.length > 0 && sortMode === 'number' && (
          <ClassGrid students={students} onSelect={onSelectStudent} password={password} />
        )}
        
        {!loading && !error && students.length > 0 && sortMode === 'grade' && (
          <>
            <div className="rounded-xl px-3 py-2 mb-3 flex items-center gap-1.5" style={{background: '#eff6ff', border: '0.5px solid #bfdbfe'}}>
              <svg className="w-3.5 h-3.5" style={{color: '#1e40af'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <p className="text-[11px]" style={{color: '#1e40af'}}>{labels.current || `${grade}학년`} 성적 · 전교과 순 · {gradeLabel} 기준</p>
            </div>
            
            {gradesLoading ? (
              <div className="flex flex-col items-center justify-center py-16">
                <div className="spinner mb-3" />
                <p className="text-xs" style={{color: '#a8a29e'}}>성적 정보 불러오는 중...</p>
              </div>
            ) : sortedByGrade.length === 0 ? (
              <p className="text-center py-8 text-sm" style={{color: '#a8a29e'}}>성적 데이터가 없습니다</p>
            ) : (
              <div className="flex flex-col gap-2">
                {sortedByGrade.map((x, idx) => (
                  <GradeRow key={x.student.studentKey} rank={idx + 1} student={x.student} gradeInfo={x.gradeInfo} gradeLabel={gradeLabel} password={password} onClick={() => onSelectStudent(x.student)} />
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function GradeRankingScreen({ password, grade, onBack, onSelectStudent }) {
  const [students, setStudents] = useState([]);
  const [gradesMap, setGradesMap] = useState({});
  const [labels, setLabels] = useState({ current: '', previous: '' });
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const classCount = CLASS_COUNT[grade] || 0;

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true); setError('');
      try {
        const [classResults, gradesResult] = await Promise.all([
          Promise.all(Array.from({ length: classCount }, (_, i) => String(i + 1)).map(c => callApi('searchClass', password, { grade, classNum: c }))),
          callApi('getGradeSemesterAll', password, { grade })
        ]);
        if (cancelled) return;
        const all = [];
        classResults.forEach(r => { if (r.success && r.results) all.push(...r.results.filter(s => !s.status || s.status === '재학')); });
        setStudents(all);
        if (gradesResult.success && gradesResult.grades) {
          const gd = gradesResult.grades;
          const cur = gd.current || {}, prevRanks = gd.previousRanks || {};
          const map = {};
          Object.keys(cur).forEach(id => { map[id] = { cur: cur[id], previousRank: prevRanks[id] || null }; });
          setGradesMap(map);
          setLabels({ current: gd.currentLabel || '', previous: gd.previousLabel || '' });
        }
      } catch { if (!cancelled) setError('데이터 로딩 실패'); }
      finally { if (!cancelled) setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [grade, password, classCount]);

  const has5 = Object.values(gradesMap).some(g => g.cur && g.cur['전교과_5등급'] !== undefined);
  const gradeLabel = has5 ? '5등급' : '9등급';

  const getGradeInfo = (student) => {
    const gd = gradesMap[student.studentId];
    if (!gd || !gd.cur) return null;
    const s = gd.cur;
    const suffix = s['전교과_5등급'] !== undefined ? '_5등급' : '_9등급';
    return { total: s[`전교과${suffix}`], total9: s['전교과_9등급'], kor: s[`국${suffix}`], math: s[`수${suffix}`], eng: s[`영${suffix}`], previousRank: gd.previousRank };
  };

  const sortedStudents = React.useMemo(() => {
    const sorted = students
      .map(s => ({ student: s, gradeInfo: getGradeInfo(s) }))
      .filter(x => x.gradeInfo && x.gradeInfo.total !== undefined && x.gradeInfo.total !== null)
      .sort((a, b) => Number(a.gradeInfo.total) - Number(b.gradeInfo.total));
    sorted.forEach((x, idx) => {
      const prev = x.gradeInfo.previousRank;
      x.gradeInfo.delta = prev ? prev - (idx + 1) : null;
    });
    return sorted;
  }, [students, gradesMap]);

  return (
    <div className="min-h-screen" style={{background: '#faf7f4'}}>
      <div className="pt-safe burgundy-gradient">
        <div className="px-5 pb-5">
          <div className="flex items-center gap-2 mb-3">
            <button onClick={onBack} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background: 'rgba(255,255,255,0.15)'}}>
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <p className="text-sm" style={{color: 'rgba(255,255,255,0.75)'}}>학년 전체 성적순</p>
          </div>
          <div className="flex items-baseline justify-between">
            <h1 className="text-2xl font-medium text-white">{grade}학년 전체</h1>
            {!loading && <p className="text-sm" style={{color: 'rgba(255,255,255,0.75)'}}>재학 {students.length}명</p>}
          </div>
        </div>
      </div>
      <div className="px-4 py-4 pb-safe">
        {loading && (
          <div className="flex flex-col items-center justify-center py-16">
            <div className="spinner mb-3" />
            <p className="text-xs" style={{color: '#a8a29e'}}>학년 전체 성적 불러오는 중...</p>
          </div>
        )}
        {!loading && error && <p className="text-center text-red-600 py-4">{error}</p>}
        {!loading && !error && (
          <>
            <div className="rounded-xl px-3 py-2 mb-3 flex items-center gap-1.5" style={{background: '#eff6ff', border: '0.5px solid #bfdbfe'}}>
              <svg className="w-3.5 h-3.5" style={{color: '#1e40af'}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <p className="text-[11px]" style={{color: '#1e40af'}}>{labels.current} 성적{labels.previous ? ` · ${labels.previous} 대비 변동` : ''}</p>
            </div>
            {sortedStudents.length === 0 ? (
              <p className="text-center py-8 text-sm" style={{color: '#a8a29e'}}>성적 데이터가 없습니다</p>
            ) : (
              <div className="flex flex-col gap-2">
                {sortedStudents.map((x, idx) => (
                  <GradeRow key={x.student.studentKey} rank={idx + 1} student={x.student} gradeInfo={x.gradeInfo} gradeLabel={gradeLabel} password={password} onClick={() => onSelectStudent(x.student)} showClass={true} showDelta={true} />
                ))}
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// 성적순 카드 컴포넌트
function GradeRow({ rank, student, gradeInfo, gradeLabel, password, onClick, showClass, showDelta }) {
  const isGrade3 = gradeLabel === '9등급';
  const delta = gradeInfo.delta;
  
  return (
    <button onClick={onClick} className="w-full bg-white rounded-xl p-2.5 flex items-center gap-2 active:opacity-70 text-left" style={{border: '0.5px solid #e7e5e4'}}>
      <div className="relative flex-shrink-0">
        <div className="w-12 h-12 rounded-lg overflow-hidden">
          <StudentPhoto student={student} password={password} className="w-full h-full object-cover" fallbackClass="w-full h-full flex items-center justify-center" showInitial={true} />
        </div>
        <div className="absolute -top-1 -left-1 w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-medium" style={{background: rank <= 3 ? '#6d1818' : '#78716c', border: '2px solid white'}}>{rank}</div>
      </div>
      
      <div className="flex-shrink-0" style={{minWidth: '48px'}}>
        <p className="text-sm font-medium leading-tight" style={{color: '#1c1917'}}>{student.name}</p>
        <p className="text-[10px]" style={{color: '#a8a29e'}}>{showClass ? `${student.classNum}반 ${student.number}번` : `${student.number}번`}</p>
      </div>
      
      <div className="text-center flex-shrink-0" style={{marginLeft: '12px'}}>
        <div className="flex items-baseline justify-center" style={{gap: '8px'}}>
          <p className="text-xl font-medium leading-none" style={{color: '#6d1818', minWidth: '32px', textAlign: 'right'}}>{gradeInfo.total || '-'}</p>
          {!isGrade3 && (
            <p className="text-[11px] leading-none" style={{color: '#a8a29e', minWidth: '32px', textAlign: 'left'}}>{gradeInfo.total9 ? `(${gradeInfo.total9})` : ''}</p>
          )}
        </div>
        <div className="flex justify-center mt-1" style={{gap: '8px'}}>
          <p className="text-[9px] leading-none" style={{color: '#a8a29e', minWidth: '32px', textAlign: 'right'}}>{isGrade3 ? '9등급' : '5등급'}</p>
          {!isGrade3 && (
            <p className="text-[9px] leading-none" style={{color: '#a8a29e', minWidth: '32px', textAlign: 'left'}}>(9등급)</p>
          )}
        </div>
      </div>
      
      <div className="flex items-center gap-2 ml-auto flex-shrink-0">
        <div className="text-center">
          <p className="text-[9px] leading-none" style={{color: '#a8a29e'}}>국</p>
          <p className="text-[13px] font-medium mt-0.5" style={{color: '#1c1917'}}>{gradeInfo.kor || '-'}</p>
        </div>
        <div className="text-center">
          <p className="text-[9px] leading-none" style={{color: '#a8a29e'}}>수</p>
          <p className="text-[13px] font-medium mt-0.5" style={{color: '#1c1917'}}>{gradeInfo.math || '-'}</p>
        </div>
        <div className="text-center">
          <p className="text-[9px] leading-none" style={{color: '#a8a29e'}}>영</p>
          <p className="text-[13px] font-medium mt-0.5" style={{color: '#1c1917'}}>{gradeInfo.eng || '-'}</p>
        </div>
        {showDelta && (
          <div className="text-center pl-1.5" style={{borderLeft: '0.5px solid #e7e5e4'}}>
            <p className="text-[8px] leading-none" style={{color: '#a8a29e'}}>전성적대비</p>
            <div className="flex items-center justify-center mt-0.5" style={{gap: '2px'}}>
              {delta === null ? (
                <span className="text-[12px] font-medium" style={{color: '#a8a29e'}}>-</span>
              ) : delta > 0 ? (
                <>
                  <svg width="7" height="6" viewBox="0 0 10 8" fill="#dc2626"><path d="M5 0 L10 8 L0 8 Z"/></svg>
                  <span className="text-[12px] font-medium" style={{color: '#dc2626'}}>+{delta}</span>
                </>
              ) : delta < 0 ? (
                <>
                  <svg width="7" height="6" viewBox="0 0 10 8" fill="#2563eb"><path d="M0 0 L10 0 L5 8 Z"/></svg>
                  <span className="text-[12px] font-medium" style={{color: '#2563eb'}}>{delta}</span>
                </>
              ) : (
                <span className="text-[12px] font-medium" style={{color: '#78716c'}}>0</span>
              )}
            </div>
          </div>
        )}
      </div>
    </button>
  );
}

function StudentDetailScreen({ student, password, onBack, onStatusChanged }) {
  return (
    <div className="min-h-screen" style={{background: '#faf7f4'}}>
      <div className="pt-safe burgundy-gradient">
        <div className="px-5 pb-4">
          <div className="flex items-center gap-2">
            <button onClick={onBack} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background: 'rgba(255,255,255,0.15)'}}>
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <p className="text-sm text-white font-medium">학생 정보</p>
          </div>
        </div>
      </div>
      <div className="px-4 py-4 pb-safe">
        <StudentCard student={student} password={password} onStatusChanged={onStatusChanged} />
      </div>
    </div>
  );
}

function MainScreen({ password, onLogout, preloadedStats }) {
  const [tab, setTab] = useState('search');
  const [view, setView] = useState('main');
  const [selectedClass, setSelectedClass] = useState(null);
  const [selectedStudent, setSelectedStudent] = useState(null);
  const [previousView, setPreviousView] = useState('main');
  const [statsRefreshKey, setStatsRefreshKey] = useState(0);
  const [classSortMode, setClassSortMode] = useState('number');
  const [selectedUniv, setSelectedUniv] = useState(null);
  const [admissionYear, setAdmissionYear] = useState(null);
  
  // 브라우저 뒤로가기 버튼 처리
  useEffect(() => {
    // 메인이 아닐 때만 history 항목 추가
    if (view !== 'main') {
      window.history.pushState({ view }, '');
    }
    
    const handlePopState = () => {
      if (view === 'studentDetail') {
        setSelectedStudent(null);
        setView(previousView);
      } else if (view === 'classDetail') {
        setSelectedClass(null);
        setView('main');
      }
    };
    
    window.addEventListener('popstate', handlePopState);
    return () => window.removeEventListener('popstate', handlePopState);
  }, [view, previousView]);
  
  const handleLogoutClick = () => {
    if (confirm('로그아웃 하시겠어요?')) {
      localStorage.removeItem(PW_KEY);
      onLogout();
    }
  };
  
  const handleOpenClass = (grade, classNum) => {
    setSelectedClass({ grade, classNum });
    setView('classDetail');
  };
  
  const handleSelectStudent = (student) => {
    setPreviousView(view);
    setSelectedStudent(student);
    setView('studentDetail');
  };
  
  const handleBackFromStudent = () => {
    setView(previousView);
    setSelectedStudent(null);
  };
  
  const handleStatusChanged = (newStatus) => {
    // 메인 화면 통계 갱신용
    setStatsRefreshKey(k => k + 1);
    // selected 학생 상태도 업데이트
    if (selectedStudent) {
      setSelectedStudent({...selectedStudent, status: newStatus});
    }
  };
  if (view === 'admissionList') {
    return <AdmissionListScreen password={password} onBack={() => setView('main')} onSelectUniv={(univ) => { setSelectedUniv(univ); setView('admissionDetail'); }} year={admissionYear} setYear={setAdmissionYear} />;
}
if (view === 'admissionDetail' && selectedUniv) {
  return <AdmissionDetailScreen password={password} univName={selectedUniv} onBack={() => setView('admissionList')} year={admissionYear} />;
}
  if (view === 'studentDetail' && selectedStudent) {
    return <StudentDetailScreen student={selectedStudent} password={password} onBack={handleBackFromStudent} onStatusChanged={handleStatusChanged} />;
  }
  if (view === 'classDetail' && selectedClass) {
    return <ClassDetailScreen password={password} grade={selectedClass.grade} classNum={selectedClass.classNum} onBack={() => setView('main')} onSelectStudent={handleSelectStudent} sortMode={classSortMode} setSortMode={setClassSortMode} />;
  }
  
  if (view === 'gradeRanking' && selectedClass) {
    return <GradeRankingScreen password={password} grade={selectedClass.grade} onBack={() => setView('main')} onSelectStudent={handleSelectStudent} />;
  }
  
  return (
    <div className="min-h-screen" style={{background: '#faf7f4'}}>
      <HomeHeader onLogout={handleLogoutClick} subtitle={tab === 'search' ? '이름 또는 학년-반-번호로 검색하세요' : '학년과 반을 선택해주세요'} />
      <div className="px-4 -mt-7 pb-safe relative">
        <TabBar tab={tab} setTab={setTab} />
        <div className="mt-4">
          {tab === 'search' ? (
            <SearchTab key={statsRefreshKey} password={password} onSelect={handleSelectStudent} onOpenAdmission={() => setView('admissionList')} />
          ) : (
            <ClassPickerTab password={password} onOpenClass={handleOpenClass} preloadedStats={preloadedStats} onOpenGradeRanking={(g) => { setSelectedClass({ grade: g, classNum: null }); setPreviousView('main'); setView('gradeRanking'); }} />
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [password, setPassword] = useState(null);
  const [checking, setChecking] = useState(true);
  const [preloadedStats, setPreloadedStats] = useState(null);
  
  // 로그인되면 즉시 통계 백그라운드 로딩
  useEffect(() => {
    if (!password) return;
    (async () => {
      try {
        const result = await callApi('getStats', password);
        if (result.success && result.stats) {
          setPreloadedStats(result.stats);
        }
      } catch {}
    })();
  }, [password]);
  
  useEffect(() => {
    const saved = localStorage.getItem(PW_KEY);
    if (saved) {
      callApi('login', saved).then(result => {
        if (result.success) setPassword(saved);
        else localStorage.removeItem(PW_KEY);
        setChecking(false);
      }).catch(() => setChecking(false));
    } else setChecking(false);
  }, []);
  
  if (checking) return <div className="min-h-screen flex items-center justify-center" style={{background: '#faf7f4'}}><div className="spinner" /></div>;
  if (!password) return <LoginScreen onLogin={setPassword} />;
  return <MainScreen password={password} onLogout={() => setPassword(null)} preloadedStats={preloadedStats} />;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
